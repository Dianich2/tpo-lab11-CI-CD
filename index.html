<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Формочка</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="container">
        <h1 id="title">Формочка</h1>
        <form id="my-form">
            <label for="name">Имя</label>
            <input id="name" name="name" type="text" placeholder="Введите имя">

            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Введите email">

            <label for="message">Сообщение</label>
            <textarea id="message" name="message" placeholder="Введите сообщение"></textarea>

            <button id="submit-button" type="submit">Отправить</button>
        </form>

        <p id="result"></p>
    </main>

    <script src="index.js"></script>
</body>
</html>
